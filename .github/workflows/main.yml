name: Flutter_Android
on:
  push:
    branches:
      - main

jobs:
  build_android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Setup Java to compile Android project
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install and set Flutter version
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Restore packages
        run: flutter pub get

      - name: Save keystore to file
        run: echo "${{ secrets.KEYSTORE_FILE }}" | base64 -d > "$GITHUB_WORKSPACE/android/app/keystore.jks"

      - name: Build Android Apk
        run: flutter build apk --release

      # The `android-actions/setup-android` action is no longer needed (and is
      # currently broken: it tries to install the removed `tools` package and
      # the since-deleted android-33 / build-tools;33.0.1). The ubuntu-latest
      # runner already ships a full Android SDK, so just locate `apksigner`
      # from the pre-installed build-tools dynamically.
      - name: Sign APK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          APKSIGNER=$(find "$SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          echo "Using apksigner: $APKSIGNER"
          "$APKSIGNER" sign --verbose \
            --ks "$GITHUB_WORKSPACE/android/app/keystore.jks" \
            --ks-key-alias nutella \
            --ks-pass env:STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$GITHUB_WORKSPACE/build/app/outputs/flutter-apk/app-release-signed.apk" \
            "$GITHUB_WORKSPACE/build/app/outputs/flutter-apk/app-release.apk"
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Publish Android Artefacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apk-signed
          path: build/app/outputs/flutter-apk/app-release-signed.apk

      - name: Rename APK for release
        run: cp build/app/outputs/flutter-apk/app-release-signed.apk build/app/outputs/flutter-apk/panaudio.apk

      - name: Set tag to current date and time
        id: set_tag
        run: echo "tag=$(date +'%Y-%m-%d_%H-%M-%S')" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.PANAUDIO_SECRET }}
          tag_name: ${{ steps.set_tag.outputs.tag }}
          name: Android ${{ steps.set_tag.outputs.tag }}
          draft: false
          prerelease: false
          files: |
            build/app/outputs/flutter-apk/panaudio.apk
